<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>WordCode</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070910;
    color:#f5f7ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    background:
        radial-gradient(circle at 70% -20%,#302060 0%,transparent 35%),
        #070910;
}

/* SIDEBAR */

.sidebar{
    width:245px;
    height:100%;
    flex-shrink:0;
    background:rgba(10,13,23,.95);
    border-right:1px solid #202638;
    padding:18px 12px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 8px 18px;
    border-bottom:1px solid #202638;
}

.logoIcon{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:linear-gradient(135deg,#7b5cff,#1ee0ad);
    font-weight:900;
    box-shadow:0 0 30px #765aff44;
}

.logoText{
    font-weight:800;
    font-size:18px;
}

.logoSub{
    font-size:10px;
    color:#748096;
}

.profile{
    padding:12px;
    border:1px solid #222a3c;
    background:#0d111c;
    border-radius:14px;
}

.profileRow{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:linear-gradient(135deg,#ff69b4,#755cff);
    font-weight:800;
}

.profileName{
    font-weight:700;
}

.profileType{
    font-size:11px;
    color:#758198;
}

.nav{
    display:grid;
    gap:5px;
}

.navButton{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    color:#8c98ad;
    background:transparent;
    border-radius:11px;
    text-align:left;
}

.navButton:hover,
.navButton.active{
    background:#171d2c;
    color:white;
}

.sideTitle{
    color:#5f6b80;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.12em;
    padding:0 10px;
}

.sideStats{
    padding:12px;
    border:1px solid #20283a;
    background:#0c1019;
    border-radius:13px;
}

.stat{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    color:#8793a8;
    font-size:12px;
}

.stat b{
    color:white;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    height:100%;
    overflow:auto;
}

/* TOPBAR */

.topbar{
    height:64px;
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 18px;
    background:rgba(7,9,16,.84);
    backdrop-filter:blur(18px);
    border-bottom:1px solid #202638;
}

.search{
    flex:1;
    max-width:720px;
    margin:auto;
}

.search input{
    width:100%;
    height:40px;
    border:1px solid #252e42;
    background:#0c111b;
    border-radius:11px;
    color:white;
    padding:0 14px;
    outline:none;
}

.search input:focus{
    border-color:#7258e8;
}

.topButton{
    height:40px;
    padding:0 15px;
    border-radius:11px;
    color:white;
    background:#151c2c;
    border:1px solid #283249;
}

.topButton.primary{
    background:linear-gradient(135deg,#7658ff,#573de0);
}

/* PAGES */

.page{
    width:min(1180px,100%);
    margin:auto;
    padding:25px;
}

.hero{
    border:1px solid #293249;
    border-radius:25px;
    padding:32px;
    background:
        radial-gradient(circle at 80% 0%,#4a318844,transparent 40%),
        linear-gradient(135deg,#12172a,#0b101a);
    box-shadow:0 20px 70px #00000044;
}

.hero h1{
    margin:10px 0;
    font-size:clamp(34px,6vw,64px);
    line-height:1;
    letter-spacing:-.05em;
}

.hero p{
    max-width:700px;
    color:#98a5bb;
    line-height:1.6;
}

.pills{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.pill{
    border:1px solid #293249;
    background:#101625;
    color:#8e9bb1;
    border-radius:999px;
    padding:6px 9px;
    font-size:10px;
}

.buttonRow{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:16px;
}

.button{
    padding:10px 14px;
    border-radius:11px;
    background:#111827;
    border:1px solid #293249;
    color:white;
}

.button.primary{
    background:linear-gradient(135deg,#7658ff,#593edc);
}

.button.green{
    background:#103b32;
    border-color:#1d6d5c;
    color:#8bffdd;
}

.section{
    margin-top:25px;
}

.sectionTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.sectionTitle h2{
    margin:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.card{
    border:1px solid #222b3e;
    background:linear-gradient(180deg,#0f1522,#0b1019);
    border-radius:17px;
    padding:16px;
}

.card h3{
    margin:0 0 7px;
}

.muted{
    color:#7f8ba0;
}

.small{
    font-size:12px;
}

/* HOME POSTS */

.post{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.postHeader{
    display:flex;
    align-items:center;
    gap:9px;
}

.postHeader .avatar{
    width:31px;
    height:31px;
    font-size:11px;
}

.postTime{
    margin-left:auto;
    color:#5f6b80;
    font-size:10px;
}

.postImage{
    height:170px;
    display:grid;
    place-items:center;
    border-radius:14px;
    font-size:60px;
    background:
        radial-gradient(circle at 70% 20%,#6952c755,transparent 30%),
        linear-gradient(135deg,#161d32,#090e17);
}

.postActions{
    display:flex;
    gap:7px;
}

.postActions button{
    padding:8px 10px;
    color:#aeb9cb;
    border:1px solid #232d40;
    background:#0e1521;
    border-radius:9px;
}

.comments{
    border-top:1px solid #20283a;
    padding-top:10px;
}

.comment{
    padding:5px 0;
    color:#a8b3c5;
    font-size:12px;
}

.comment b{
    color:white;
}

.commentBox{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.commentBox input{
    flex:1;
    min-width:0;
    border:1px solid #242e42;
    background:#080d15;
    color:white;
    padding:8px;
    border-radius:9px;
    outline:none;
}

/* CREATE */

.createGrid{
    display:grid;
    grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);
    gap:15px;
}

.fieldLabel{
    display:block;
    color:#7d899e;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.1em;
    margin:15px 0 7px;
}

.field{
    width:100%;
    background:#080d15;
    color:white;
    border:1px solid #263047;
    border-radius:12px;
    padding:11px;
    outline:none;
}

textarea.field{
    min-height:135px;
    resize:vertical;
}

.aiPanel{
    margin-top:14px;
    border:1px solid #352c69;
    background:linear-gradient(145deg,#14132b,#0b111e);
    border-radius:16px;
    padding:14px;
}

.aiHeader{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
}

.aiDot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#20d6a2;
    box-shadow:0 0 12px #20d6a2;
}

.aiOutput{
    min-height:220px;
    max-height:350px;
    overflow:auto;
    white-space:pre-wrap;
    background:#05080d;
    border:1px solid #1a2436;
    border-radius:11px;
    padding:12px;
    font:12px/1.7 monospace;
    color:#b8c7df;
}

.quickCommands{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
}

.quickCommands button{
    border:1px solid #242e41;
    background:#0e1521;
    color:#9eabc0;
    border-radius:8px;
    padding:6px 8px;
    font-size:11px;
}

/* PROJECTS */

.projectCard{
    overflow:hidden;
}

.projectPreview{
    height:130px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:
        radial-gradient(circle,#5540a555,transparent 35%),
        #0a101b;
    font-size:50px;
}

/* WORLD */

.worldLayout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 250px;
    gap:14px;
}

.worldCard{
    padding:0;
    overflow:hidden;
}

.worldHeader{
    height:50px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 13px;
    border-bottom:1px solid #20283a;
}

.world{
    height:520px;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(#111b2d,#080d17);
    background-size:32px 32px;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

.entity{
    position:absolute;
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    font-size:25px;
    border-radius:10px;
    pointer-events:none;
    z-index:5;
}

.entity.player{
    background:#7658ff2b;
    box-shadow:0 0 25px #7658ff66;
}

.entity.zombie{
    filter:drop-shadow(0 5px 8px #000);
}

.entity.coin{
    font-size:20px;
}

.joystick{
    position:absolute;
    left:20px;
    bottom:18px;
    width:125px;
    height:125px;
    border-radius:50%;
    border:1px solid #34415a;
    background:#0b1220cc;
    z-index:20;
    touch-action:none;
}

.joystickKnob{
    position:absolute;
    left:38px;
    top:38px;
    width:49px;
    height:49px;
    border-radius:50%;
    background:#7658ff;
    border:1px solid #a99aff;
    box-shadow:0 8px 20px #0006;
}

.worldButtons{
    position:absolute;
    right:18px;
    bottom:20px;
    display:flex;
    gap:8px;
    z-index:20;
}

.worldButton{
    width:54px;
    height:54px;
    border-radius:50%;
    background:#0c1422dd;
    border:1px solid #34415a;
    color:white;
    font-size:20px;
    touch-action:manipulation;
}

.worldInfo{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.infoBox{
    border:1px solid #202a3c;
    background:#0c111b;
    border-radius:12px;
    padding:11px;
}

.log{
    max-height:260px;
    overflow:auto;
}

.logLine{
    font-size:11px;
    color:#8996aa;
    padding:5px 0;
    border-bottom:1px solid #171f2f;
}

/* EDITOR */

.editor{
    margin-top:15px;
}

.code{
    width:100%;
    min-height:310px;
    resize:vertical;
    background:#05080d;
    color:#b9c9e2;
    border:1px solid #202b40;
    border-radius:13px;
    padding:14px;
    outline:none;
    font:12px/1.65 monospace;
}

/* EMPTY */

.empty{
    border:1px dashed #29344b;
    border-radius:17px;
    padding:50px 20px;
    text-align:center;
    color:#748096;
}

/* TOAST */

.toast{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:100;
    padding:11px 14px;
    background:#151d2c;
    border:1px solid #34415a;
    border-radius:12px;
    box-shadow:0 15px 40px #0008;
}

/* MOBILE */

@media(max-width:850px){

    .sidebar{
        position:fixed;
        z-index:70;
        left:0;
        right:0;
        bottom:0;
        top:auto;
        width:100%;
        height:67px;
        padding:5px;
        border-right:0;
        border-top:1px solid #202638;
        display:block;
    }

    .logo,
    .profile,
    .sideTitle,
    .sideStats{
        display:none;
    }

    .nav{
        height:100%;
        display:flex;
        justify-content:space-around;
        align-items:center;
    }

    .navButton{
        width:auto;
        display:flex;
        flex-direction:column;
        gap:2px;
        padding:7px 12px;
        font-size:10px;
        text-align:center;
    }

    .main{
        padding-bottom:70px;
    }

    .topbar{
        height:58px;
    }

    .search{
        display:none;
    }

    .page{
        padding:14px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .createGrid{
        grid-template-columns:1fr;
    }

    .worldLayout{
        grid-template-columns:1fr;
    }

    .world{
        height:440px;
    }

    .hero{
        padding:22px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        <div class="logoIcon">W</div>
        <div>
            <div class="logoText">WordCode</div>
            <div class="logoSub">CREATOR PLATFORM</div>
        </div>
    </div>

    <div class="profile">
        <div class="profileRow">
            <div class="avatar">A</div>
            <div>
                <div class="profileName">Adi</div>
                <div class="profileType">Creator</div>
            </div>
        </div>
    </div>

    <nav class="nav">
        <button class="navButton active" data-page="home">⌂<span>Home</span></button>
        <button class="navButton" data-page="create">✦<span>Create</span></button>
        <button class="navButton" data-page="projects">▣<span>Projects</span></button>
        <button class="navButton" data-page="activity">◌<span>Activity</span></button>
    </nav>

    <div class="sideTitle">Platform</div>

    <div class="sideStats">
        <div class="stat">
            <span>Projects</span>
            <b id="sideProjects">0</b>
        </div>

        <div class="stat">
            <span>Published</span>
            <b id="sidePublished">0</b>
        </div>

        <div class="stat">
            <span>Commands</span>
            <b id="sideCommands">0</b>
        </div>
    </div>

    <div class="sideTitle">Engine</div>

    <div class="sideStats">
        <div class="stat">
            <span>Parser</span>
            <b>LOCAL</b>
        </div>

        <div class="stat">
            <span>AI</span>
            <b>WORDCODE</b>
        </div>

        <div class="stat">
            <span>Cloud</span>
            <b>OFFLINE</b>
        </div>
    </div>

</aside>


<main class="main">

<header class="topbar">

    <div class="search">
        <input id="search" placeholder="Search creations, projects and creators...">
    </div>

    <button class="topButton" id="reset">Reset</button>

    <button class="topButton primary" id="createButton">
        + Create
    </button>

</header>

<div id="page"></div>

</main>

</div>


<script>

/* ==========================================================
   WORDCODE PLATFORM
   Version 0.5.0
   Single-file local-first prototype
   ========================================================== */

const STORAGE_KEY = "WORDCODE_PLATFORM_V050";

const DEFAULT_STATE = {
    page:"home",

    projects:[],

    posts:[],

    activity:[],

    likes:{},

    stats:{
        commands:0,
        generations:0
    },

    memory:{
        lastPrompt:"",
        lastCommands:[]
    }
};

let state = loadState();

let currentProject = null;

let worldLoop = null;


/* ==========================================================
   STORAGE
   ========================================================== */

function loadState(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            );

        if(saved){

            return {
                ...DEFAULT_STATE,
                ...saved,
                stats:{
                    ...DEFAULT_STATE.stats,
                    ...(saved.stats || {})
                },
                memory:{
                    ...DEFAULT_STATE.memory,
                    ...(saved.memory || {})
                }
            };
        }

    }catch(error){

        console.error(error);

    }

    return JSON.parse(
        JSON.stringify(DEFAULT_STATE)
    );
}


function saveState(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

    updateSidebar();
}


/* ==========================================================
   UTILITIES
   ========================================================== */

function id(prefix){

    return prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .slice(2,7);

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function toast(message){

    const element =
        document.createElement("div");

    element.className="toast";

    element.textContent=message;

    document.body.appendChild(element);

    setTimeout(
        ()=>element.remove(),
        2500
    );

}


function activity(message){

    state.activity.unshift({

        id:id("activity"),

        message,

        time:new Date().toLocaleString()

    });

    state.activity =
        state.activity.slice(0,100);

    saveState();

}


function updateSidebar(){

    document.getElementById("sideProjects")
        .textContent=state.projects.length;

    document.getElementById("sidePublished")
        .textContent=state.posts.length;

    document.getElementById("sideCommands")
        .textContent=state.stats.commands;

}


/* ==========================================================
   NAVIGATION
   ========================================================== */

function go(page){

    state.page=page;

    saveState();

    render();

}


document.querySelectorAll(".navButton")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{
            go(button.dataset.page);
        }
    );

});


document.getElementById("createButton")
.addEventListener(
    "click",
    ()=>go("create")
);


/* ==========================================================
   HOME
   ========================================================== */

function renderHome(search=""){

    let posts=[...state.posts];

    if(search){

        posts=posts.filter(post=>

            (
                post.title+
                " "+
                post.description+
                " "+
                post.creator
            )
            .toLowerCase()
            .includes(search.toLowerCase())

        );

    }

    document.getElementById("page").innerHTML=`

    <div class="page">

        <section class="hero">

            <div class="pills">

                <span class="pill">WORDCODE ENGINE</span>
                <span class="pill">LOCAL FIRST</span>
                <span class="pill">CREATOR PLATFORM</span>
                <span class="pill">IPAD READY</span>

            </div>

            <h1>Build with words.</h1>

            <p>
                WordCode turns ordinary language into editable
                commands, playable worlds and publishable projects.
                Create something, test it, edit it and put it on the
                community feed.
            </p>

            <div class="buttonRow">

                <button class="button primary"
                        id="startCreate">
                    ✦ Start creating
                </button>

                <button class="button"
                        id="demoWorld">
                    ▶ Demo world
                </button>

            </div>

        </section>


        <section class="section">

            <div class="sectionTitle">

                <h2>What creators can do</h2>

            </div>

            <div class="grid">

                <div class="card">
                    <h3>🧠 Natural language</h3>
                    <p class="muted small">
                        Describe mechanics in normal language.
                        WordCode identifies entities, properties,
                        numbers and relationships.
                    </p>
                </div>

                <div class="card">
                    <h3>🎮 Live worlds</h3>
                    <p class="muted small">
                        Generated projects can become playable
                        worlds with movement, enemies, coins and
                        interactions.
                    </p>
                </div>

                <div class="card">
                    <h3>🌎 Community</h3>
                    <p class="muted small">
                        Publish creations to Home, collect likes and
                        comments, and build a local creator feed.
                    </p>
                </div>

            </div>

        </section>


        <section class="section">

            <div class="sectionTitle">
                <h2>Community</h2>
            </div>

            ${
                posts.length

                ?

                `<div class="grid">
                    ${posts.map(postHTML).join("")}
                </div>`

                :

                `<div class="empty">
                    No creations have been published yet.
                    <br><br>
                    Be the first creator.
                    <br><br>
                    <button class="button primary"
                            id="firstCreate">
                        Create something
                    </button>
                </div>`
            }

        </section>

    </div>
    `;


    document.getElementById("startCreate")
        ?.addEventListener(
            "click",
            ()=>go("create")
        );


    document.getElementById("firstCreate")
        ?.addEventListener(
            "click",
            ()=>go("create")
        );


    document.getElementById("demoWorld")
        ?.addEventListener(
            "click",
            createDemoWorld
        );


    wirePosts();

}


function postHTML(post){

    const liked=!!state.likes[post.id];

    return `

    <article class="card post">

        <div class="postHeader">

            <div class="avatar">
                ${escapeHTML(
                    (post.creator || "A")[0]
                    .toUpperCase()
                )}
            </div>

            <div>
                <b>${escapeHTML(post.creator)}</b>

                <div class="small muted">
                    ${escapeHTML(post.title)}
                </div>
            </div>

            <span class="postTime">
                ${escapeHTML(post.time)}
            </span>

                !state.likes[post.id];

            saveState();

            renderHome(
                document.getElementById("search")
                    .value
            );

        };

    });


    document.querySelectorAll("[data-open]")
    .forEach(button=>{

        button.onclick=()=>{

            const post=
                state.posts.find(
                    x=>x.id===button.dataset.open
                );

            if(post){

                openProject(
                    structuredClone(post.project)
                );

            }

        };

    });


    document.querySelectorAll("[data-comment-send]")
    .forEach(button=>{

        button.onclick=()=>{

            const post=
                state.posts.find(
                    x=>x.id===button.dataset.commentSend
                );

            const input=
                document.querySelector(
                    `[data-comment-input="${button.dataset.commentSend}"]`

            const text=input.value.trim();

            if(!text)return;

            post.comments.push({

                name:"Adi",

            });

            saveState();

            renderHome();

        };

    });

/* ==========================================================
   WORDCODE INTELLIGENCE
   ========================================================== */

function numberAfter(text,words,defaultValue=null){

    const expression =
        new RegExp(
            "(?:"+
            words.join("|")+
            ")" +
            "\\s*(?:is|of|to|at|with)?\\s*" +
            "(\\d+(?:\\.\\d+)?)",
            "i"
        );

    const match=text.match(expression);

    return match
        ? Number(match[1])
        : defaultValue;

}


function has(text,words){

    return words.some(
        word =>
            new RegExp(
                "\\b"+
                word+
                "\\b",
                "i"
            ).test(text)
    );

}


function semanticPlan(prompt){

    const text=prompt.trim();

    const lower=text.toLowerCase();

    const commands=[];

    function add(command){

        if(!commands.includes(command))
            commands.push(command);

    }


    const health=
        numberAfter(
            text,
            ["health","hp"],
            null
        );


    const speed=
        numberAfter(
            text,
            ["speed"],
            null
        );


    /*
       PLAYER
    */

    if(has(lower,["player","character","hero"])){

        add("CREATE PLAYER");

        if(health!==null)
            add(`SET Player.health ${health}`);

        if(speed!==null)
            add(`SET Player.speed ${speed}`);

    }


    /*
       ZOMBIE
    */

    if(has(lower,["zombie","zombies"])){

        add("CREATE ENEMY Zombie");

        if(health!==null)
            add(`SET Zombie.health ${health}`);

        if(speed!==null)
            add(`SET Zombie.speed ${speed}`);

        if(has(lower,["chase","follow","hunt","attack"]))

            add("BEHAVIOR Zombie.chase Player");

    }


    /*
       BOSS
    */

    if(has(lower,["boss"])){

        add("CREATE BOSS Boss");

        if(health!==null)
            add(`SET Boss.health ${health}`);

        if(speed!==null)
            add(`SET Boss.speed ${speed}`);

        if(has(lower,["chase","follow","hunt","attack"]))

            add("BEHAVIOR Boss.chase Player");

    }


    /*
       GENERIC ENEMY
    */

    if(
        has(lower,["enemy","enemies","monster"])
        &&
        !has(lower,["zombie","boss"])
    ){

        add("CREATE ENEMY Enemy");

        if(health!==null)
            add(`SET Enemy.health ${health}`);

        if(speed!==null)
            add(`SET Enemy.speed ${speed}`);

    }


    /*
       COINS
    */

    if(has(lower,["coin","coins"])){

        let amount=
            numberAfter(
                text,
                ["coins","coin","create","add","spawn"],
                1
            );

        amount=
            Math.max(
                1,
                Math.min(
                    Number(amount)||1,
                    100
                )
            );

        for(let i=0;i<amount;i++){

            const x=
                120+
                (i%10)*55;

            const y=
                120+
                Math.floor(i/10)*55;

            add(`SPAWN COIN ${x} ${y}`);

        }

    }


    /*
       HOUSE
    */

    if(has(lower,["house","home","building","base"])){

        add("CREATE OBJECT House");

        add("SET House.type shelter");

    }


    /*
       DOOR
    */

    if(has(lower,["door"])){

        add("CREATE OBJECT Door");

        add("SET Door.interactive true");

    }


    /*
       MOVEMENT
    */

    if(has(lower,["move","movement","walk","run"])){

        add("INPUT movement TOUCH_KEYBOARD");

    }


    /*
       JUMP
    */

    if(has(lower,["jump","jumping"])){

        add("INPUT jump");

    }


    /*
       SHOOTING
    */

    if(
        has(
            lower,
            ["shoot","shooting","weapon","projectile","fire"]
        )
    ){

        add("CREATE SYSTEM Projectiles");

        add("INPUT fire");

    }


    /*
       HEALTH UI
    */

    if(
        has(
            lower,
            ["healthbar","health bar"]
        )
    ){

        add("UI HEALTHBAR Player.health");

    }


    /*
       SCORE
    */

    if(has(lower,["score","points"])){

        add("CREATE SYSTEM Score");

        add("SET Score.value 0");

    }


    /*
       TIMER
    */

    if(has(lower,["timer","countdown"])){

        add("CREATE SYSTEM Timer");

    }


    /*
       DAY NIGHT
    */

    if(
        has(
            lower,
            ["day night","day-night","night cycle"]
        )
    ){

        add("WORLD DAY_NIGHT");

    }


    /*
       WEATHER
    */

    if(
        has(
            lower,
            ["weather","rain","storm"]
        )
    ){

        add("WORLD WEATHER");

    }


    /*
       AUDIO
    */

    if(
        has(
            lower,
            ["music","sound","audio"]
        )
    ){

        add("AUDIO ENABLE");

    }


    /*
       SAVE
    */

    if(
        has(
            lower,
            ["save","autosave"]
        )
    ){

        add("SYSTEM AUTOSAVE");

    }


    /*
       TELEPORT
    */

    if(has(lower,["teleport"])){

        add("INPUT teleport");

    }


    /*
       GRAVITY
    */

    if(has(lower,["gravity"])){

        const gravity=
            numberAfter(
                text,
                ["gravity"],
                9.8
            );

        add(`PHYSICS gravity ${gravity}`);

    }


    /*
       FALLBACK
    */

    if(commands.length===0){

        add("CREATE PLAYER");

        add("SET Player.health 100");

        add("INPUT movement TOUCH_KEYBOARD");

    }


    return {

        commands,

        confidence:
            Math.min(
                99,
                70+commands.length*3
            ),

        inputTokens:
            text
                .split(/\s+/)
                .filter(Boolean)
                .length

    };

}

async function generate(){

    const input=
        document.getElementById("idea");

    const output=
        document.getElementById("aiOutput");

    const status=
        document.getElementById("aiStatus");

    const prompt=input.value.trim();

    if(!prompt){

        toast("Describe what you want to build.");

        return;

    }


    status.textContent="THINKING...";

    output.textContent=
        "Analyzing intent...\n"+
        "Extracting entities...\n"+
        "Planning relationships...";


    await delay(250);


    const plan=
        semanticPlan(prompt);


    await delay(250);


    output.textContent=
        plan.commands.join("\n")+
        "\n\n"+
        "// Confidence: "+
        plan.confidence+
        "%"+
        "\n// Commands: "+
        plan.commands.length;


    status.textContent="READY";


    state.memory.lastPrompt=prompt;

    state.memory.lastCommands=
        plan.commands;


    state.stats.commands +=
        plan.commands.length;

    state.stats.generations++;


    saveState();


    toast(
        plan.commands.length+
        " WordCode commands generated."
    );

}


function delay(ms){

    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );

}

/* ==========================================================
   WORLD ENGINE
   ========================================================== */

function startWorld(project){

    if(worldLoop)
        clearInterval(worldLoop);


    const world=
        document.getElementById("world");


    if(!world)return;


    world
        .querySelectorAll(".entity")
        .forEach(e=>e.remove());


    const model={

        entities:[],

        player:null,

        hp:100,

        coins:0,

        input:{
            x:0,
            y:0
        }

    };


    const W=world.clientWidth;

    const H=world.clientHeight;


    function createEntity(
        type,
        x,
        y,
        options={}
    ){

        const entity={

            id:id("entity"),

            type,

            x,

            y,

            health:
                options.health ??
                100,

            speed:
                options.speed ??
                1.2,

            behavior:
                options.behavior ??
                "",

            element:null

        };


        const element=
            document.createElement("div");


        element.className=
            "entity "+
            type.toLowerCase();


        element.textContent=
            type==="Player"
            ? "🧑"
            : type==="Zombie"
            ? "🧟"
            : type==="Boss"
            ? "👹"
            : type==="Coin"
            ? "🪙"
            : "👾";


        entity.element=element;

        world.appendChild(element);

        model.entities.push(entity);

        return entity;

    }


    /*
       Compile WordCode
    */

    for(const command of project.commands){

        let match;


        if(/^CREATE PLAYER/i.test(command)){

            model.player=
                createEntity(
                    "Player",
                    W*.48,
                    H*.55
                );

            continue;

        }


        if(/^CREATE ENEMY Zombie/i.test(command)){

            const enemy=
                createEntity(
                    "Zombie",
                    randomBetween(70,W-70),
                    randomBetween(80,H-100),
                    {health:300}
                );

            continue;

        }


        if(/^CREATE BOSS/i.test(command)){

            createEntity(
                "Boss",
                W*.75,
                H*.25,
                {
                    health:2000,
                    speed:.7
                }
            );

            continue;

        }


        if(/^CREATE ENEMY Enemy/i.test(command)){

            createEntity(
                "Enemy",
                W*.7,
                H*.4
            );

            continue;

        }


        match=
            command.match(
                /^SET\s+(\w+)\.health\s+([\d.]+)/i
            );


        if(match){

            const entity=
                findType(
                    model,
                    match[1]
                );

            if(entity)
                entity.health=
                    Number(match[2]);

            if(
                entity &&
                entity.type==="Player"
            )
                model.hp=
                    entity.health;

            continue;

        }


        match=
            command.match(
                /^SET\s+(\w+)\.speed\s+([\d.]+)/i
            );


        if(match){

            const entity=
                findType(
                    model,
                    match[1]
                );

            if(entity)
                entity.speed=
                    Number(match[2]);

            continue;

        }


        match=
            command.match(
                /^BEHAVIOR\s+(\w+)\.chase/i
            );


        if(match){

            const entity=
                findType(
                    model,
                    match[1]
                );

            if(entity)
                entity.behavior="chase";

            continue;

        }


        match=
            command.match(
                /^SPAWN COIN\s+([\d.]+)\s+([\d.]+)/i
            );


        if(match){

            createEntity(
                "Coin",
                Number(match[1]),
                Number(match[2])
            );

            model.coins++;

            continue;

        }

    }


    if(!model.player){

        model.player=
            createEntity(
                "Player",
                W*.48,
                H*.55
            );

    }


    function paint(){

        for(const entity of model.entities){

            if(!entity.element)
                continue;

            entity.element.style.left=
                (entity.x-19)+"px";

            entity.element.style.top=
                (entity.y-19)+"px";

        }


        document.getElementById("entityCount")
            .textContent=
            model.entities.length;


        document.getElementById("playerHP")
            .textContent=
            Math.max(
                0,
                Math.round(model.hp)
            );


        document.getElementById("coinCount")
            .textContent=
            model.coins;

    }


    function movePlayer(){

        const p=model.player;

        if(!p)return;


        const magnitude=
            Math.hypot(
                model.input.x,
                model.input.y
            ) || 1;


        const speed=3.1;


        p.x+=
            model.input.x/
            magnitude*
            speed;


        p.y+=
            model.input.y/
            magnitude*
            speed;


        p.x=
            Math.max(
                20,
                Math.min(
                    W-20,
                    p.x
                )
            );


        p.y=
            Math.max(
                20,
                Math.min(
                    H-20,
                    p.y
                )
            );

    }


    function enemyAI(){

        const p=model.player;

        if(!p)return;


        for(const entity of model.entities){

            if(
                !["Zombie","Boss","Enemy"]
                .includes(entity.type)
            )
                continue;


            if(entity.behavior!=="chase")
                continue;


            const dx=
                p.x-entity.x;

            const dy=
                p.y-entity.y;

            const distance=
                Math.hypot(dx,dy)||1;


            entity.x+=
                dx/distance*
                entity.speed;


            entity.y+=
                dy/distance*
                entity.speed;


            if(distance<29){

                model.hp-=
                    entity.type==="Boss"
                    ? .35
                    : .12;

            }

        }

    }


    function collectCoins(){

        const p=model.player;


        for(const entity of model.entities){

            if(entity.type!=="Coin")
                continue;


            if(entity.collected)
                continue;


            if(
                Math.hypot(
                    entity.x-p.x,
                    entity.y-p.y
                )<30
            ){

                entity.collected=true;

                entity.element.remove();

                model.coins++;

                worldEvent(
                    "Coin collected"
                );

            }

        }

    }


    /*
       KEYBOARD
       Desktop support without breaking touch.
    */

    const keys={};


    function keyDown(e){

        keys[e.key.toLowerCase()]=true;

    }


    function keyUp(e){

        keys[e.key.toLowerCase()]=false;

    }


    window.onkeydown=keyDown;

    window.onkeyup=keyUp;


    function updateKeyboard(){

        if(
            keys.w ||
            keys.arrowup
        )
            model.input.y=-1;

        else if(
            keys.s ||
            keys.arrowdown
        )
            model.input.y=1;

        else if(!joystickActive)
            model.input.y=0;


        if(
            keys.a ||
            keys.arrowleft
        )
            model.input.x=-1;

        else if(
            keys.d ||
            keys.arrowright
        )
            model.input.x=1;

        else if(!joystickActive)
            model.input.x=0;

    }


    /*
       IPAD JOYSTICK
       Pointer Events avoid the old
       "dragging selects the webpage" problem.
    */

    const joystick=
        document.getElementById("joystick");

    const knob=
        document.getElementById("joystickKnob");


    let joystickActive=false;


    function joystickMove(event){

        const rect=
            joystick.getBoundingClientRect();


        const centerX=
            rect.left+
            rect.width/2;


        const centerY=
            rect.top+
            rect.height/2;


        let x=
            event.clientX-centerX;


        let y=
            event.clientY-centerY;


        const max=40;


        const distance=
            Math.hypot(x,y);


        if(distance>max){

            x=
                x/distance*
                max;

            y=
                y/distance*
                max;

        }


        model.input.x=x/max;

        model.input.y=y/max;


        knob.style.transform=
            `translate(${x}px,${y}px)`;

    }


    joystick.addEventListener(
        "pointerdown",
        event=>{

            joystickActive=true;

            joystick.setPointerCapture?.(
                event.pointerId
            );

            joystickMove(event);

            event.preventDefault();

        }
    );


    joystick.addEventListener(
        "pointermove",
        event=>{

            if(!joystickActive)
                return;

            joystickMove(event);

            event.preventDefault();

        }
    );


    function releaseJoystick(){

        joystickActive=false;

        model.input.x=0;

        model.input.y=0;

        knob.style.transform=
            "translate(0,0)";

    }


    joystick.addEventListener(
        "pointerup",
        releaseJoystick
    );


    joystick.addEventListener(
        "pointercancel",
        releaseJoystick
    );


    document.getElementById("jump")
        .onclick=()=>{

            model.player.y-=40;

            worldEvent("Player jumped");

        };


    document.getElementById("action")
        .onclick=()=>{

            worldEvent(
                "Player performed an action"
            );

        };


    function tick(){

        updateKeyboard();

        movePlayer();

        enemyAI();

        collectCoins();

        paint();

    }


    paint();

    worldLoop=
        setInterval(
            tick,
            50
        );

}


function findType(model,type){

    return model.entities.find(
        entity=>
            entity.type.toLowerCase()===
            type.toLowerCase()
    );

}


function randomBetween(min,max){

    return Math.random()*
        (max-min)+
        min;

}


function worldEvent(message){

    const log=
        document.getElementById("worldLog");

    if(!log)return;


    const item=
        document.createElement("div");

    item.className="logLine";

    item.textContent=
        "• "+
        message;


    log.prepend(item);


    while(log.children.length>12)
        log.lastChild.remove();

}

/* ==========================================================
   PUBLISH
   ========================================================== */

function publish(project){

    const stored=
        state.projects.find(
            p=>p.id===project.id
        );


    if(!stored){

        toast(
            "Save this project before publishing."
        );

        return;

    }


    const existing=
        state.posts.find(
            post=>
                post.project &&
                post.project.id===
                project.id
        );


    if(existing){

        existing.project=
            structuredClone(project);

        existing.description=
            project.description;

        existing.time="updated";

        saveState();

        toast("Published project updated.");

        go("home");

        return;

    }


    const post={

        id:id("post"),

        creator:"Adi",

        title:project.name,

        description:
            project.description ||
            "A WordCode creation.",

        icon:
            project.icon ||
            "✦",

        tags:[
            "wordcode",
            "creation",
            "build"
        ],

        likes:0,

        comments:[],

        time:"just now",

        project:
            structuredClone(project)

    };


    state.posts.unshift(post);

    stored.published=true;

    saveState();


    activity(
        `Published "${project.name}" to Home`
    );


    toast(
        "Published to Home."
    );


    go("home");

}


/* ==========================================================
   ACTIVITY
   ========================================================== */

function renderActivity(){

    document.getElementById("page").innerHTML=`

    <div class="page">

        <section class="hero">

            <div class="pills">
                <span class="pill">ACTIVITY</span>
                <span class="pill">LOCAL LOG</span>
            </div>

            <h1>Activity.</h1>

            <p class="muted">
                Everything important WordCode has done on
                this device.
            </p>

        </section>


        <section class="section">

            ${
                state.activity.length

                ?

                `<div class="card">
                    ${state.activity
                        .map(item=>
                            `<div class="logLine">
                                <b>
                                    ${escapeHTML(item.message)}
                                </b>
                                <br>
                                ${escapeHTML(item.time)}
                            </div>`
                        )
                        .join("")}
                </div>`

                :

                `<div class="empty">
                    Nothing has happened yet.
                </div>`
            }

        </section>

    </div>
    `;

}


/* ==========================================================
   RENDER
   ========================================================== */

function render(){

    document
        .querySelectorAll(".navButton")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.page===
                state.page
            );

        });


    if(state.page==="home")
        renderHome();


    if(state.page==="create")
        renderCreate();


    if(state.page==="projects")
        renderProjects();


    if(state.page==="activity")
        renderActivity();


    updateSidebar();

}


/* ==========================================================
   SEARCH
   ========================================================== */

document.getElementById("search")
.addEventListener(
    "input",
    event=>{

        const value=
            event.target.value.trim();

        if(state.page==="home")
            renderHome(value);

    }
);


/* ==========================================================
   RESET
   ========================================================== */

document.getElementById("reset")
.addEventListener(
    "click",
    ()=>{

        const confirmReset=
            confirm(
                "Delete all WordCode projects, posts and local data?"
            );


        if(!confirmReset)
            return;


        localStorage.removeItem(
            STORAGE_KEY
        );


        state=
            JSON.parse(
                JSON.stringify(
                    DEFAULT_STATE
                )
            );


        go("home");

        toast("WordCode reset.");

    }
);


/* ==========================================================
   START
   ========================================================== */

render();

</script>
